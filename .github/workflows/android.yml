name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned so the Oct 19 ubuntu-latest -> Ubuntu 26 switch can't break the build

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NotifDetector-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: NotifDetector-debug
          path: NotifDetector-debug.apk

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-debug >/dev/null 2>&1 || \
            gh release create latest-debug --prerelease \
              --title "Latest debug build" \
              --notes "Auto-built from ${GITHUB_SHA::7}"
          gh release upload latest-debug NotifDetector-debug.apk --clobber
